[config]
 
[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"
 
[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"
 
[templates.wofi]
input_path = "~/.config/matugen/templates/wofi-colors.css"
output_path = "~/.config/wofi/colors.css"
# wofi читает style.css заново при каждом открытии — reload не нужен
 
[templates.swayosd]
input_path = "~/.config/matugen/templates/swayosd-colors.css"
output_path = "~/.config/swayosd/colors.css"
post_hook = "pkill swayosd-server; swayosd-server & disown"

[templates.battery_panel]
input_path = "~/.config/matugen/templates/BatteryPanel.qml"
output_path = "~/.config/quickshell/battery-panel/BatteryPanel.qml"

[templates.power_menu]
input_path = "~/.config/matugen/templates/PowerMenu.qml"
output_path = "~/.config/quickshell/power-menu/PowerMenu.qml"

[templates.wifi_panel]
input_path = '~/.config/matugen/templates/WifiPanel.qml'
output_path = '~/.config/quickshell/wifi-panel/WifiPanel.qml'
 














