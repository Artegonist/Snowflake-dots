[config]
 
[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"
 
[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/colors.css"
post_hook = "pkill -SIGUSR2 waybar"
 
[templates.wofi]
input_path = "~/.config/matugen/templates/wofi-colors.css"
output_path = "~/.config/wofi/colors.css"
 
[templates.snowflake]
input_path = '~/.config/matugen/templates/snowflake-colors.json'
output_path = '~/.config/quickshell/snowflake/colors.json'

[templates.clipboard_module]
input_path = '~/.config/matugen/templates/clipboard-colors.json'
output_path = '~/.config/quickshell/clipboard-module/colors.json'
