# ---------------SECRET WORKSPACE SETTINGS---------------
# Bound to the (otherwise useless) Copilot key. It sends Super+Shift+F23,
# which shows up as XF86TouchpadOff in wev. On your machine the key
# name may differ, so check it with wev and change the bind below. 
bind = SUPER SHIFT, XF86TouchpadOff, togglespecialworkspace, secret
gesture = 3, up, special, secret
gesture = 3, down, special, secret
animations {
    animation = specialWorkspace, 1, 5, default, slidevert
}

