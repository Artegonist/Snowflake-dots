source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

animations {
    enabled = true

    bezier = smooth, 0.16, 1, 0.3, 1
    bezier = punchy, 0.4, 0, 0.2, 1.4

    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, punchy
    animation = inputFieldColors, 1, 3, smooth
    animation = inputFieldFade, 1, 2, smooth
    animation = inputFieldWidth, 1, 2, punchy
}

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 2
    no_fade_in = false
    no_fade_out = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M:%S")"
    color = $text_main
    font_size = 90
    font_family = $font Bold
    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = $text_dim
    font_size = 22
    font_family = $font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(playerctl metadata --format ' {{ artist }} — {{ title }}' 2>/dev/null)"
    color = $accent_secondary
    font_size = 16
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face
    size = 120
    border_size = 3
    border_color = $accent_primary
    rounding = -1
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Привет, $USER
    color = $text_main
    font_size = 20
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] echo " $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null)%"
    color = $text_dim
    font_size = 16
    font_family = $font
    position = 30, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:1000] echo " $(hyprctl devices -j | jq -r '.keyboards[] | select(.main == true) | .active_keymap')"
    color = $text_dim
    font_size = 16
    font_family = $font
    position = -30, 30
    halign = right
    valign = bottom
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent_primary
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = $text_main
    fade_on_empty = true
    placeholder_text = <i>Введите пароль...</i>
    hide_input = false
    check_color = $accent_secondary
    fail_color = rgba(255, 100, 100, 1.0)
    fail_text = <i>Неверно</i>
    rounding = 20
    position = 0, -150
    halign = center
    valign = center
}
