$text_main = eef3efff
$text_dim = 8fa196ff

source = ~/.config/hypr/colors.conf

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true

    bezier = smooth, 0.16, 1, 0.3, 1
    bezier = punchy, 0.4, 0, 0.2, 1.4

    animation = fadeIn, 1, 4, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldDots, 1, 2, punchy
    animation = inputFieldColors, 1, 3, smooth
    animation = inputFieldFade, 1, 2, smooth
    animation = inputFieldWidth, 1, 2, punchy
}

background {
    monitor =
    path = screenshot
    color = rgba(1c211eff)

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.2
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = cmd[update:1000] date '+%H:%M:%S'

    color = rgba($text_main)
    font_size = 90
    font_family = $font Bold

    position = 0, 300
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'

    color = rgba($text_dim)
    font_size = 22
    font_family = $font

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:5000] playerctl metadata --format '\{{markup_escape(trunc(artist, 18))}} — \{{markup_escape(trunc(title, 30))}}' 2>/dev/null || true
    color = rgba($accent_secondary)
    font_size = 16
    font_family = $font

    position = 0, 160
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.face

    size = 120
    border_size = 3
    border_color = rgba($accent_primary)
    rounding = -1

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Привет, $USER

    color = rgba($text_main)
    font_size = 20
    font_family = $font

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:30000] awk -F= 'function show() { if (kind == "Battery" && scope != "Device" && present != "0" && charge ~ /^[0-9]+$/) { printf "%s%s: %s%%", sep, name, charge; sep = " · " } } FNR == 1 { show(); name = kind = scope = charge = present = "" } $1 == "POWER_SUPPLY_NAME" { name = $2 } $1 == "POWER_SUPPLY_TYPE" { kind = $2 } $1 == "POWER_SUPPLY_SCOPE" { scope = $2 } $1 == "POWER_SUPPLY_PRESENT" { present = $2 } $1 == "POWER_SUPPLY_CAPACITY" { charge = $2 } END { show() }' /sys/class/power_supply/*/uevent 2>/dev/null || true

    color = rgba($text_dim)
    font_size = 16
    font_family = $font

    position = 30, 30
    halign = left
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT

    color = rgba($text_dim)
    font_size = 16
    font_family = $font

    position = -30, 30
    halign = right
    valign = bottom
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    outer_color = rgba($accent_primary)
    inner_color = rgba(00000080)
    font_color = rgba($text_main)
    font_family = $font

    fade_on_empty = true
    placeholder_text = <i>Введите пароль...</i>
    hide_input = false

    check_color = rgba($accent_secondary)
    fail_color = rgba(ff6464ff)
    fail_text = <i>Неверно</i>

    rounding = 20

    position = 0, -150
    halign = center
    valign = center
}
