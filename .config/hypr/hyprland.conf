env = HYPRCURSOR_THEME,Flat-Remix-Blue-Dark
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Flat-Remix-Blue-Dark
env = XCURSOR_SIZE,24
# ------------- ARTEGONISTS HYPRLAND CONFIG -------------
# Other files
source = ~/.config/hypr/quickshellautostart.conf
source = ~/.config/hypr/secret.conf
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/experimental.conf

# Main key 
$mainMod = SUPER

# Main apps
$terminal = kitty
$filemanager = nautilus
$browser = firefox
$menu = wofi --show drun
$screenshots = "$(xdg-user-dir PICTURES)/screenshots"

# Autolaunch 
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar
exec-once = hyprctl setcursor Flat-Remix-Blue-Dark 24
exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh
# Polkit agent (mate-polkit). Path is for Debian/Fedora,
# On Arch use /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec-once = /usr/libexec/polkit-mate-authentication-agent-1
# exec-once = quickshell
exec-once = easyeffects --gapplication-service
exec-once = hypridle 

# Windows rules
windowrule {
  name = apply-something
  match:class = kitty

  opacity = 0.50
}



# Layer rules 
layerrule = no_anim on, match:namespace wofi

# ---------------- MONITORS ----------------
monitor = ,preferred,auto,1

# ---------------- BINDS (APPS) ----------------
# Terminal
bind = $mainMod, Q, exec, $terminal

# File manager
bind = $mainMod, E, exec, $filemanager

# Browser
bind = $mainMod, R, exec, $browser

# Menu
bind = $mainMod, W, exec, pkill -u "$(id -u)" -x wofi || $menu

# Logout
#bind = $mainMod, L, exec, uwsm stop

# Waybar reload
bind = $mainMod, P, exec, pkill -SIGUSR2 -u "$(id -u)" -x waybar || waybar

# Wallpaper next
bind = $mainMod, N, exec, ~/.config/hypr/scripts/wallpaper-next.sh

#Layout next
bind = $mainMod, K, exec, ~/.config/hypr/scripts/toggle_layout.sh

#Macrobar toggle
bind = $mainMod, M, exec, qs -c macrobar-module ipc call macroPanel toggle

# Config reload
# bind = $mainMod SHIFT, R, exec, hyprctl reload

# ---------------- WINDOWS NAVIGATION ----------------
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, C, killactive

bind = $mainMod, D, togglefloating
bind = $mainMod, D, exec, if hyprctl activewindow -j | jq -e '.floating == true' >/dev/null; then hyprctl --batch "dispatch resizeactive exact 800 600; dispatch centerwindow"; fi

binde = $mainMod SHIFT, S, layoutmsg, splitratio 1.0 exact

bind = $mainMod, A, fullscreen, 1
bind = $mainMod SHIFT, A, fullscreen, 0

bind = $mainMod, F, layoutmsg, togglesplit
bind = $mainMod SHIFT, F, exec, ~/.config/hypr/scripts/toggle-preserve-split.sh
bind = $mainMod, S, layoutmsg, swapsplit
bind = $mainMod, Tab, layoutmsg, cyclenext
bind = $mainMod SHIFT, Tab, layoutmsg, cycleprev

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

binde = $mainMod CTRL, left, resizeactive,-50 0
binde = $mainMod CTRL, right, resizeactive,50 0
binde = $mainMod CTRL, up, resizeactive,0 -50
binde = $mainMod CTRL, down, resizeactive,0 50

binde = $mainMod ALT, left, moveactive, -20 0
binde = $mainMod ALT, right, moveactive, 20 0
binde = $mainMod ALT, up, moveactive, 0 -20
binde = $mainMod ALT, down, moveactive, 0 20

# ---------------- WORKSPACES ----------------
gesture = 3, horizontal, workspace

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
#bind = $mainMod, 6, workspace, 6
#bind = $mainMod, 7, workspace, 7
#bind = $mainMod, 8, workspace, 8
#bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
#bind = $mainMod SHIFT, 6, movetoworkspace, 6
#bind = $mainMod SHIFT, 7, movetoworkspace, 7
#bind = $mainMod SHIFT, 8, movetoworkspace, 8
#bind = $mainMod SHIFT, 9, movetoworkspace, 9

#----------------- CONTROL ------------------
binde = , XF86AudioRaiseVolume, exec, qs -c osd-module ipc call osd incVolume 2
binde = , XF86AudioLowerVolume, exec, qs -c osd-module ipc call osd incVolume -2
binde = , XF86MonBrightnessUp, exec, brightnessctl --class=backlight set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl --class=backlight --min-value=$(( $(brightnessctl --class=backlight max) / 20 )) set 5%-
bind = , XF86AudioMute, exec, qs -c osd-module ipc call osd muteToggle
bind = , XF86AudioMicMute, exec, qs -c osd-module ipc call osd micToggle

#-----------------SCREENSHOTS-----------------
bind = , XF86Cut, exec, flock -n -o "$XDG_RUNTIME_DIR/hyprshot.lock" hyprshot -m output -o $screenshots
bind = $mainMod, XF86Cut, exec, flock -n -o "$XDG_RUNTIME_DIR/hyprshot.lock" hyprshot -m window -o $screenshots
bind = SHIFT, XF86Cut, exec, flock -n -o "$XDG_RUNTIME_DIR/hyprshot.lock" hyprshot -m region -o $screenshots

# ---------------- VISUAL ----------------
general {
    border_size = 3
    resize_on_border = true
    gaps_in = 5
    gaps_out = 3
    col.active_border = rgba($accent_primary)
    col.inactive_border = rgba($accent_primary)
}

decoration {
    rounding = 5

    shadow {
        enabled = true
        range = 4
        render_power = 3
    }

    blur {
        enabled = true
        size = 4
        passes = 2
    }
    
}

misc {
    disable_hyprland_logo = true
}
dwindle {
    preserve_split = true
}

# ---------------- INPUT ----------------
input {
    # Keyboard layouts: replace with your own (e.g. us,de or us,fr)
    # Alt+Shift cycles through them
    kb_layout = us,ru,dk
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        disable_while_typing = false
    }
}


#rgba($accent_secondary)
